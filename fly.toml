app = "nifty-analyzer"
primary_region = "sin"

[build]

[env]
  PORT = "8080"
  PYTHONUNBUFFERED = "1"
  DB_PATH = "/data/trading_platform.db"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  grace_period = "20s"
  interval = "30s"
  method = "GET"
  timeout = "10s"
  path = "/health"

[[mounts]]
  source = "data_vol"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
